<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: archive</title>
<!-- Static mockup for docs/design/ui.md (direction A). Generated from the design canvas; edit ui.md first. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFBFC}
a{color:#4B4FC9}a:hover{color:#363AA8}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.navrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;color:#16181D;text-decoration:none}
.navrow:hover{background:#F1F2F5}
.navon{background:#ECEDF1;font-weight:500}
.seg{border:0;background:none;padding:5px 12px;border-radius:6px;font:500 13px Inter,sans-serif;color:#5F6672;cursor:pointer}
.seg-on{background:#FFFFFF;color:#16181D;box-shadow:0 1px 2px rgba(16,24,40,0.08)}
.btn{border:1px solid #E6E8EC;background:#FFFFFF;border-radius:6px;padding:6px 10px;font:500 13px Inter,sans-serif;color:#16181D;cursor:pointer}
.chipf{border:1px solid #E6E8EC;background:#FFFFFF;border-radius:999px;padding:4px 10px;font:500 12px Inter,sans-serif;color:#5F6672;cursor:pointer}
.chipf-on{background:#16181D;border-color:#16181D;color:#FFFFFF}
th{text-align:left;font-size:12px;font-weight:500;color:#5F6672;padding:10px 12px;border-bottom:1px solid #E6E8EC;white-space:nowrap}
td{font-size:13px;padding:11px 12px;border-bottom:1px solid #EEF0F3;white-space:nowrap}
tr.rowlink:hover td{background:#F7F7F9;cursor:pointer}
.oc{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%}
.o-merged{color:#4B4FC9}.o-merged .dot{background:#4B4FC9}
.o-closed{color:#5F6672}.o-closed .dot{background:#8B919C}
.o-you{color:#5F6672}.o-you .dot{border:1.5px solid #8B919C;width:6px;height:6px}
</style>
</head>
<body>
<div style="min-height:900px;display:flex;flex-wrap:wrap;font-family:Inter,system-ui,sans-serif;color:#16181D;background:#FBFBFC">
  <aside style="flex:1 1 220px;max-width:100%;box-sizing:border-box;padding:16px 12px;border-right:1px solid #E6E8EC;background:#F7F7F9;display:flex;flex-direction:column;gap:16px">
    <div style="padding:0 8px;font-weight:600;font-size:14px">agent-supervisor</div>
    <button class="btn" style="text-align:left">New task</button>
    <nav aria-label="Views" style="display:flex;flex-direction:column;gap:2px">
      <a class="navrow" href="#">Board <span style="margin-left:auto;font-size:12px;color:#5F6672">6</span></a>
      <a class="navrow navon" href="#" aria-current="page">Archive <span style="margin-left:auto;font-size:12px;color:#5F6672">25</span></a>
    </nav>
    <nav aria-label="Projects" style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:11px;font-weight:500;color:#5F6672;text-transform:uppercase;letter-spacing:0.06em;padding:0 8px 6px">Projects</span>
      <a class="navrow" href="#">web-app</a><a class="navrow" href="#">api-service</a><a class="navrow" href="#">infra</a>
    </nav>
    <div style="margin-top:auto"><a class="navrow" href="#">Settings</a></div>
  </aside>
  <main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid #E6E8EC;background:#FFFFFF">
      <div role="tablist" aria-label="View" style="display:flex;gap:2px;background:#F1F2F5;border-radius:8px;padding:3px"><button role="tab" class="seg">Board</button><button role="tab" aria-selected="true" class="seg seg-on">Archive</button></div>
      <button class="btn">All projects ▾</button>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <label for="q" style="position:absolute;left:-9999px">Search archived tasks</label>
        <input id="q" placeholder="Search title or branch" style="border:1px solid #E6E8EC;border-radius:6px;padding:7px 10px;font:13px Inter,sans-serif;width:220px">
      </div>
    </header>
    <div style="padding:16px 24px 8px;display:flex;flex-wrap:wrap;gap:6px" role="group" aria-label="Filter by outcome">
      <button class="chipf chipf-on" aria-pressed="true">All 25</button><button class="chipf">Merged 19</button><button class="chipf">PR closed 2</button><button class="chipf">Archived by you 4</button>
    </div>
    <div style="margin:8px 24px 24px;background:#FFFFFF;border:1px solid #E6E8EC;border-radius:8px;overflow-x:auto">
      
            
            
            
            
            
            
            
            <table style="width:100%;border-collapse:collapse">
        <thead><tr><th>Task</th><th>Project</th><th>Agent</th><th>Outcome</th><th>PR</th><th>Finished</th><th>Usage</th></tr></thead>
        <tbody>
          <tr class="rowlink"><td style="font-weight:500;white-space:normal;min-width:240px"></td><td style="color:#5F6672"></td><td style="color:#5F6672"></td><td><span class="oc "><span class="dot"></span></span></td><td class="mono" style="font-size:12px"></td><td style="color:#5F6672"></td><td style="color:#5F6672"></td></tr>
          
        </tbody>
      </table>
    </div>
    <p style="margin:0 24px 24px;font-size:12px;color:#5F6672">Opening an archived task shows its Chat, Diff and history read-only.</p>
  </main>
</div>
</body>
</html>
