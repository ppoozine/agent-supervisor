<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Add project dialog</title>
<!-- Static mockup for docs/design/ui.md (direction A). Generated from the design canvas; edit ui.md first. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFBFC}
a{color:#4B4FC9}a:hover{color:#363AA8}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.lab{display:block;font-size:12px;font-weight:500;color:#3A404A;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;border:1px solid #E6E8EC;border-radius:6px;padding:8px 10px;font:13px 'JetBrains Mono',monospace;color:#16181D;background:#FFFFFF}
.req{display:flex;gap:8px;font-size:12px;color:#5F6672;line-height:1.5}
</style>
</head>
<body>
<div style="width:720px;height:900px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(22,24,29,0.32);font-family:Inter,system-ui,sans-serif;color:#16181D">
  <form role="dialog" aria-labelledby="apTitle" style="width:100%;max-width:560px;background:#FFFFFF;border-radius:12px;box-shadow:0 24px 60px rgba(16,24,40,0.24);display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid #EEF0F3">
      <h2 id="apTitle" style="margin:0;font-size:15px;font-weight:600">Add project</h2>
      <button type="button" aria-label="Close" style="margin-left:auto;border:0;background:none;padding:6px;border-radius:6px;color:#5F6672;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="padding:18px 20px;display:flex;flex-direction:column;gap:16px">
      <div>
        <label class="lab" for="apPath">Repo path</label>
        <input id="apPath" class="inp" value="/Users/you/code/web-app/frontend" aria-invalid="true" aria-describedby="apErr" style="border-color:#D64550;box-shadow:0 0 0 3px #FBE3E5">
        <p id="apErr" style="margin:6px 0 0;font-size:12px;color:#B4232F">Not the top of a git repository. Did you mean /Users/you/code/web-app?</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:8px;background:#F7F7F9">
        <span style="font-size:12px;font-weight:500;color:#3A404A">The folder needs</span>
        <span class="req"><span aria-hidden="true">·</span>to be the top of a local git repository</span>
        <span class="req"><span aria-hidden="true">·</span>a GitHub remote that <span class="mono">gh</span> can reach; tasks open their pull requests there</span>
        <span class="req"><span aria-hidden="true">·</span>no other project already using it</span>
      </div>
      <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" style="margin-top:2px;accent-color:#4B4FC9">
        <span><span style="display:block;font-size:13px;font-weight:500">Require an approving review</span><span style="display:block;font-size:12px;color:#5F6672;margin-top:2px">Tasks reach Ready to merge only after someone approves the PR.</span></span>
      </label>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid #EEF0F3">
      <span style="font-size:12px;color:#5F6672">⌘↵ to add</span>
      <button type="button" style="margin-left:auto;border:1px solid #E6E8EC;background:#FFFFFF;border-radius:6px;padding:7px 12px;font:500 13px Inter,sans-serif;color:#16181D;cursor:pointer">Cancel</button>
      <button type="submit" style="border:0;background:#4B4FC9;border-radius:6px;padding:8px 14px;font:500 13px Inter,sans-serif;color:#FFFFFF;cursor:pointer">Add project</button>
    </div>
  </form>
</div>
</body>
</html>
