<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Runs panel</title>
<!-- Static mockup for docs/design/ui.md (direction A). Generated from the design canvas; edit ui.md first. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFBFC}
a{color:#4B4FC9}a:hover{color:#363AA8}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.tab{border:0;background:none;padding:10px 2px;margin-right:16px;font:500 13px Inter,sans-serif;color:#5F6672;cursor:pointer;border-bottom:2px solid transparent}
.tab-on{color:#16181D;border-bottom-color:#16181D}
.stat{flex:1 1 100px;background:#FFFFFF;border:1px solid #E6E8EC;border-radius:8px;padding:10px 12px}
.run{display:block;width:100%;text-align:left;background:#FFFFFF;border:1px solid #E6E8EC;border-radius:8px;padding:12px;font:inherit;color:inherit;cursor:pointer}
.run:hover{border-color:#C9CDD5}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.s-you{background:#4B4FC9}.s-auto{background:#A35200}
.o-ok{color:#1E7A45}.o-run{color:#2F54C9}.o-stop{color:#5F6672}.o-err{color:#B4232F}
</style>
</head>
<body>
<div style="width:580px;height:900px;box-sizing:border-box;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;color:#16181D;background:#FBFBFC;border-left:1px solid #E6E8EC">
  <div role="tablist" style="display:flex;padding:0 20px;border-bottom:1px solid #E6E8EC;background:#FFFFFF">
    <button role="tab" class="tab">Diff</button><button role="tab" class="tab">Shell</button><button role="tab" class="tab">Events</button><button role="tab" aria-selected="true" class="tab tab-on">Runs <span style="color:#5F6672;font-weight:400">4</span></button>
  </div>
  <div style="padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto">
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <div class="stat"><div style="font-size:11px;color:#5F6672">Tokens</div><div style="font-size:16px;font-weight:600;margin-top:2px">3.9M</div></div>
      <div class="stat"><div style="font-size:11px;color:#5F6672">Agent time</div><div style="font-size:16px;font-weight:600;margin-top:2px">19m</div></div>
      <div class="stat"><div style="font-size:11px;color:#5F6672">Automatic fixes</div><div style="font-size:16px;font-weight:600;margin-top:2px">0 / 3</div></div>
      <div class="stat"><div style="font-size:11px;color:#5F6672">Comment rounds</div><div style="font-size:16px;font-weight:600;margin-top:2px">1 / 5</div></div>
    </div>
    <p style="margin:0;font-size:12px;color:#5F6672">Select a run to jump to it in Chat.</p>
    
      <button class="run">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:600">Run 4</span>
          <span class="dot s-auto"></span>
          <span style="font-size:13px;color:#3A404A">Automatic: PR comments</span>
          <span class="o-run" style="margin-left:auto;font-size:12px;font-weight:500">● Running</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:#5F6672">
          <span>Today 08:40</span><span>2m so far</span><span>—</span><span class="mono"></span>
        </div>
      </button>
    
      <button class="run">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:600">Run 3</span>
          <span class="dot s-auto"></span>
          <span style="font-size:13px;color:#3A404A">Automatic: CI failed</span>
          <span class="o-err" style="margin-left:auto;font-size:12px;font-weight:500">✗ Error</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:#5F6672">
          <span>Today 08:36</span><span>1m 40s</span><span>180k tok</span><span class="mono">on 9c1e55a</span>
        </div>
      </button>
    
      <button class="run">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:600">Run 2</span>
          <span class="dot s-you"></span>
          <span style="font-size:13px;color:#3A404A">Your message</span>
          <span class="o-ok" style="margin-left:auto;font-size:12px;font-weight:500">✓ Success</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:#5F6672">
          <span>Today 08:19</span><span>12m 07s</span><span>3.5M tok</span><span class="mono">→ f2e2268</span>
        </div>
      </button>
    
      <button class="run">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:600">Run 1</span>
          <span class="dot s-you"></span>
          <span style="font-size:13px;color:#3A404A">Task opened</span>
          <span class="o-ok" style="margin-left:auto;font-size:12px;font-weight:500">✓ Success</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:#5F6672">
          <span>Yesterday 15:41</span><span>40s</span><span>223k tok</span><span class="mono">no changes</span>
        </div>
      </button>
    
  </div>
</div>
</body>
</html>
