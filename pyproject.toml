[project]
name = "agent-supervisor"
version = "0.3.0rc1"
description = "Orchestration and audit layer for AI coding agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.182",
    "fastapi>=0.164.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agsv = "agent_supervisor.cli:main"

# Agent adapters register here; other packages add theirs the same way (docs/guide/adapters.md).
[project.entry-points."agent_supervisor.adapters"]
claude_code = "agent_supervisor.adapters.claude_code:ClaudeCodeAdapter"
codex = "agent_supervisor.adapters.codex:CodexAdapter"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
