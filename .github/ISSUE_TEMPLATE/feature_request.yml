name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working. Alternatives you considered are welcome too.
  - type: checkboxes
    id: checked
    attributes:
      label: Before opening
      options:
        - label: I checked the open issues and the known limitations in docs/guide/trust-model.md.
        - label: If this is about a new agent, I read docs/guide/adapters.md (adapters can be separate packages).
